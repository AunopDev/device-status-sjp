<div class="login-page">
  <button
    type="button"
    class="login-theme-toggle btn btn-sm btn-ghost btn-circle"
    (click)="toggleTheme()"
    [attr.aria-label]="themeService.isDark() ? 'สลับเป็นธีมสว่าง' : 'สลับเป็นธีมมืด'"
  >
    @if (themeService.isDark()) {
      <svg xmlns="http://www.w3.org/2000/svg" class="login-theme-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" class="login-theme-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
      </svg>
    }
  </button>

  <div class="login-container">
    <div class="login-header">
      <div class="login-icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="login-icon-svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"
          />
        </svg>
      </div>

      <h1 class="login-title">Device Status SJP</h1>
      <p class="login-subtitle">เข้าสู่ระบบเพื่อดูสถานะโปรเจกต์</p>
    </div>

    <form class="login-form" (ngSubmit)="submit()">
      @if (sessionEnded) {
        <p role="status" class="text-sm">เซสชันสิ้นสุดแล้ว กรุณาเข้าสู่ระบบอีกครั้ง</p>
      }
      @if (errorMessage()) {
        <div class="login-error alert alert-error" role="alert">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="login-error-icon stroke-current"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            />
          </svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <div class="login-field">
        <label for="username" class="login-label">ชื่อผู้ใช้</label>
        <label class="login-input-wrap input input-bordered">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="login-input-icon"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"
            />
          </svg>
          <input
            type="text"
            id="username"
            name="username"
            class="grow"
            placeholder="กรอกชื่อผู้ใช้"
            autocomplete="username"
            [ngModel]="username()"
            (ngModelChange)="username.set($event)"
          />
        </label>
      </div>

      <div class="login-field">
        <label for="password" class="login-label">รหัสผ่าน</label>
        <label class="login-input-wrap input input-bordered">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="login-input-icon"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"
            />
          </svg>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            id="password"
            name="password"
            class="grow"
            placeholder="กรอกรหัสผ่าน"
            autocomplete="current-password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
          />
          <button
            type="button"
            class="login-toggle-visibility"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน'"
          >
            @if (showPassword()) {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="login-input-icon"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                />
              </svg>
            } @else {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="login-input-icon"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
            }
          </button>
        </label>
      </div>

      <button type="submit" class="login-submit btn btn-primary" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="loading loading-spinner loading-sm"></span>
          กำลังเข้าสู่ระบบ...
        } @else {
          เข้าสู่ระบบ
        }
      </button>
    </form>
  </div>
</div>
