<div class="dashboard-page">
  <div class="dashboard-container">
    <header class="dashboard-header">
      <div class="dashboard-logo">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="dashboard-logo-svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"
          />
        </svg>
      </div>
      <div class="dashboard-title-group">
        <h1 class="dashboard-title">Device Status SJP</h1>
      </div>


      <div class="dashboard-user-area">
        @if (currentUser(); as user) {
          <div class="dashboard-user-chip">
            <div class="dashboard-user-avatar">
              {{ user.username.charAt(0).toUpperCase() }}
            </div>
            <span class="dashboard-user-name">{{ user.username }}</span>
          </div>
        }
        <button
          type="button"
          class="dashboard-theme-toggle btn btn-sm btn-ghost btn-circle"
          (click)="toggleTheme()"
          [attr.aria-label]="themeService.isDark() ? 'สลับเป็นธีมสว่าง' : 'สลับเป็นธีมมืด'"
        >
          @if (themeService.isDark()) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="dashboard-theme-icon"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
              />
            </svg>
          } @else {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="dashboard-theme-icon"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
              />
            </svg>
          }
        </button>
        <button type="button" class="dashboard-logout btn btn-sm btn-ghost" (click)="logout()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="dashboard-logout-icon"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"
            />
          </svg>
          <span class="dashboard-logout-label">ออกจากระบบ</span>
        </button>
      </div>
    </header>

    <main class="dashboard-workspace" aria-label="ภาพรวมโครงการและอุปกรณ์">
      @if (activeView() === 'nodes') {
        <section class="dashboard-nodes" aria-label="รายการจุดติดตั้งทั้งหมด">
          <div class="directory-hero"></div>
        </section>
      } @else if (activeView() === 'devices') {
        <section class="dashboard-device-view" aria-label="อุปกรณ์ทั้งหมด">
          <app-row-group
            (refreshRequested)="reloadDevices()"
            [embedded]="true"
            [inputDevices]="devices()"
            [inputLoading]="devicesLoading()"
            [inputError]="devicesError()"
          />
        </section>
      }
    </main>
  </div>
</div>
